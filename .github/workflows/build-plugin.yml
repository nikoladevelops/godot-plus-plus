build:
    needs: [init-config, clear-cache]
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_32, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: x86_64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: windows, arch: x86_32, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: windows, arch: x86_64, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: windows, arch: arm64, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: macos, arch: universal, os: macos-latest, lto_input: "${{ github.event.inputs.lto_macos }}" },
            { platform: android, arch: x86_64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: android, arch: arm32, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: android, arch: arm64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: ios, arch: arm64, os: macos-latest, lto_input: "${{ github.event.inputs.lto_ios }}" },
            { platform: web, arch: wasm32, os: ubuntu-22.04, threads: "no", lto_input: "${{ github.event.inputs.lto_web }}" },
            { platform: web, arch: wasm32, os: ubuntu-22.04, threads: "yes", lto_input: "${{ github.event.inputs.lto_web_threads }}" }
          ]
        target-type: ${{ fromJson(needs.init-config.outputs.target_types) }}

    env:
      PLUGIN_NAME: ${{ needs.init-config.outputs.plugin_name }}
      CI: "true"

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC Environment
        if: ${{ matrix.target.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target.arch == 'x86_32' && 'x86' || (matrix.target.arch == 'arm64' && 'arm64' || 'x64') }}

      - name: Set build name
        id: set-build-name
        shell: bash
        run: |
          NAME="${{ env.PLUGIN_NAME }}.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}.single${{ (matrix.target.platform == 'web' && matrix.target.threads == 'yes') && '.threads' || '' }}"
          echo "build_name=$NAME" >> $GITHUB_OUTPUT
          echo "cache_name=${NAME//./_}_${{ matrix.target.lto_input }}" >> $GITHUB_OUTPUT

      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      - name: Set SCONS_CACHE
        if: ${{ github.event.inputs.use_cache == 'true' }}
        shell: bash
        run: echo "SCONS_CACHE=${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}" >> $GITHUB_ENV

      - name: Restore .scons_cache
        if: ${{ github.event.inputs.use_cache == 'true' }}
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}
          cache-name: ${{ steps.set-build-name.outputs.cache_name }}

      - name: Build GDExtension (Windows MSVC)
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          $ltoFlag = ""
          if ("${{ matrix.target-type }}" -eq "template_release" -and "${{ matrix.target.lto_input }}" -ne "none") {
              $ltoFlag = " lto=${{ matrix.target.lto_input }}"
          }

          $sconsCmd = "scons target=${{ matrix.target-type }} platform=windows arch=${{ matrix.target.arch }} precision=single$ltoFlag"
          Write-Host "Running: $sconsCmd"
          Invoke-Expression $sconsCmd

      - name: Build GDExtension (Non-Windows)
        if: ${{ matrix.target.platform != 'windows' }}
        shell: bash
        run: |
          THREADS_FLAG=""
          if [ "${{ matrix.target.platform }}" = "web" ]; then
            THREADS_FLAG=" threads=${{ matrix.target.threads }}"
          fi

          LTO_FLAG=""
          if [ "${{ matrix.target-type }}" = "template_release" ] && [ "${{ matrix.target.lto_input }}" != "none" ]; then
            LTO_FLAG=" lto=${{ matrix.target.lto_input }}"
          fi

          scons target=${{ matrix.target-type }} \
                platform=${{ matrix.target.platform }} \
                arch=${{ matrix.target.arch }} \
                precision=single \
                $THREADS_FLAG \
                $LTO_FLAG

      - name: Save .scons_cache
        if: ${{ github.event.inputs.use_cache == 'true' }}
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}
          cache-name: ${{ steps.set-build-name.outputs.cache_name }}

      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-build-name.outputs.build_name }}
          path: ${{ github.workspace }}/bin
          retention-days: 1
